name: Repository hygiene
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit repository
        run: node --import tsx src/cli.ts hygiene --strict --history 100 --json > "$RUNNER_TEMP/hygiene-report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-hygiene
          path: ${{ runner.temp }}/hygiene-report.json
          if-no-files-found: error
